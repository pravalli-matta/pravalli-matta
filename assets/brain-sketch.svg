<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Colourful animated illustration of the brain, with moving neural signals">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8ee"/><stop offset="1" stop-color="#f3f5f1"/></linearGradient>
 <linearGradient id="frontal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4b5a2"/><stop offset="1" stop-color="#e98983"/></linearGradient>
 <linearGradient id="parietal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5d58b"/><stop offset="1" stop-color="#eab65f"/></linearGradient>
 <linearGradient id="temporal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9c9bd"/><stop offset="1" stop-color="#6fa99b"/></linearGradient>
 <linearGradient id="occipital" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8b3dc"/><stop offset="1" stop-color="#8e8bc4"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4d6260" flood-opacity=".12"/></filter>
 <clipPath id="brainClip"><path d="M450 252 C414 246 390 226 385 198 C355 184 346 151 361 126 C351 94 372 65 402 61 C416 29 451 20 479 37 C504 8 548 15 562 43 C594 27 629 43 635 74 C670 85 679 119 662 145 C680 174 662 207 633 214 C622 245 587 258 558 241 C532 266 488 268 468 246Z"/></clipPath>
</defs>
<rect width="1000" height="320" rx="16" fill="url(#bg)"/>
<g opacity=".45" fill="none" stroke="#c8cfc6" stroke-width="1">
 <path d="M60 70 H260 M740 250 H940 M110 260 H270 M760 60 H910"/>
 <circle cx="180" cy="70" r="3" fill="#c8cfc6"/><circle cx="840" cy="250" r="3" fill="#c8cfc6"/>
</g>
<g filter="url(#shadow)">
 <path d="M450 252 C414 246 390 226 385 198 C355 184 346 151 361 126 C351 94 372 65 402 61 C416 29 451 20 479 37 C504 8 548 15 562 43 C594 27 629 43 635 74 C670 85 679 119 662 145 C680 174 662 207 633 214 C622 245 587 258 558 241 C532 266 488 268 468 246Z" fill="#fffdf8" stroke="#405c5a" stroke-width="4"/>
 <g clip-path="url(#brainClip)">
  <path d="M345 40 Q450 0 500 110 Q480 155 440 175 Q390 170 345 120Z" fill="url(#frontal)" opacity=".96"/>
  <path d="M475 15 Q590 0 650 80 Q625 125 570 135 Q510 120 485 85Z" fill="url(#parietal)" opacity=".96"/>
  <path d="M350 145 Q430 130 495 165 Q510 220 455 275 Q370 250 345 205Z" fill="url(#temporal)" opacity=".96"/>
  <path d="M500 135 Q600 110 690 145 L680 270 Q590 280 520 230 Q485 190 500 135Z" fill="url(#occipital)" opacity=".96"/>
  <g fill="none" stroke="#fffaf0" stroke-width="3" opacity=".85" stroke-linecap="round">
   <path d="M395 58 Q423 75 409 105 Q396 128 427 144"/>
   <path d="M445 34 Q470 58 452 84 Q438 108 470 126"/>
   <path d="M514 37 Q492 62 520 83 Q543 99 526 123"/>
   <path d="M574 49 Q550 76 577 95 Q600 112 582 132"/>
   <path d="M380 164 Q413 151 430 179 Q444 202 475 190"/>
   <path d="M490 157 Q467 183 493 207 Q516 230 495 253"/>
   <path d="M552 151 Q531 177 555 197 Q579 216 560 246"/>
   <path d="M615 145 Q588 166 614 186 Q637 204 615 229"/>
  </g>
 </g>
 <path d="M496 252 C488 226 499 207 516 190 C529 176 527 155 510 142" fill="none" stroke="#405c5a" stroke-width="3" stroke-linecap="round"/>
 <path d="M450 252 C414 246 390 226 385 198 C355 184 346 151 361 126 C351 94 372 65 402 61 C416 29 451 20 479 37 C504 8 548 15 562 43 C594 27 629 43 635 74 C670 85 679 119 662 145 C680 174 662 207 633 214 C622 245 587 258 558 241 C532 266 488 268 468 246Z" fill="none" stroke="#405c5a" stroke-width="4"/>
</g>
<!-- clearly visible travelling signal -->
<g fill="none" stroke="#fff" stroke-width="2.5">
 <path d="M395 105 C430 75 457 85 480 119 S530 166 562 115 S612 88 637 124" stroke="#fff" stroke-width="7" opacity=".6"/>
 <path d="M395 105 C430 75 457 85 480 119 S530 166 562 115 S612 88 637 124" stroke="#3f7774" stroke-width="2.5" stroke-dasharray="7 8">
  <animate attributeName="stroke-dashoffset" values="0;-60" dur="2.4s" repeatCount="indefinite"/>
 </path>
</g>
<circle r="8" fill="#fff" stroke="#3f7774" stroke-width="3">
 <animateMotion dur="4.8s" repeatCount="indefinite" path="M395 105 C430 75 457 85 480 119 S530 166 562 115 S612 88 637 124"/>
</circle>
<circle cx="480" cy="119" r="7" fill="none" stroke="#d87866" stroke-width="2">
 <animate attributeName="r" values="5;18;5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;.9" dur="2s" repeatCount="indefinite"/>
</circle>
<circle cx="562" cy="115" r="7" fill="none" stroke="#7d78b7" stroke-width="2">
 <animate attributeName="r" values="5;18;5" dur="2.3s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;.9" dur="2.3s" begin=".7s" repeatCount="indefinite"/>
</circle>
<!-- labels -->
<g font-family="Georgia,serif" font-size="13" letter-spacing="2" fill="#536d68">
 <text x="105" y="106">THOUGHT</text><text x="105" y="127" font-size="10" letter-spacing="1" fill="#9b8270">patterns &amp; perception</text>
 <text x="735" y="185">MEMORY</text><text x="735" y="206" font-size="10" letter-spacing="1" fill="#9b8270">traces &amp; connections</text>
</g>
<g fill="none" stroke="#c48b62" stroke-width="1.5" stroke-dasharray="3 5">
 <path d="M210 133 C270 133 304 113 364 108"/>
 <path d="M637 178 C685 190 700 190 727 190"/>
</g>
<g fill="#c48b62"><circle cx="364" cy="108" r="3"/><circle cx="637" cy="178" r="3"/></g>
<text x="500" y="296" text-anchor="middle" font-family="Georgia,serif" font-size="11" letter-spacing="3" fill="#82918a">MIND  ·  BRAIN  ·  BEHAVIOUR</text>
</svg>